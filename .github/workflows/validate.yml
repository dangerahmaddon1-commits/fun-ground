name: Fun Ground checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: fun-ground-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Resolve dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Apply compatible dependency security patches
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependency vulnerabilities
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8"));
            if (report.error || !report.metadata?.vulnerabilities) {
              console.error("Dependency audit did not return a valid report:", report.error || "missing vulnerability metadata");
              process.exit(1);
            }
            const v = report.metadata.vulnerabilities;
            console.log("Dependency audit summary:", JSON.stringify(v));
            if ((v.high || 0) > 0 || (v.critical || 0) > 0) process.exitCode = 1;
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(JSON.stringify({ package: name, severity: item.severity, direct: item.isDirect, range: item.range, via: item.via, fixAvailable: item.fixAvailable }));
            }
          '
      - name: Audit production dependency vulnerabilities
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit-production.json", "utf8"));
            if (report.error || !report.metadata?.vulnerabilities) {
              console.error("Production dependency audit did not return a valid report:", report.error || "missing vulnerability metadata");
              process.exit(1);
            }
            const v = report.metadata.vulnerabilities;
            console.log("Production dependency audit summary:", JSON.stringify(v));
            if ((v.high || 0) > 0 || (v.critical || 0) > 0) process.exitCode = 1;
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(JSON.stringify({ package: name, severity: item.severity, direct: item.isDirect, range: item.range, via: item.via, fixAvailable: item.fixAvailable }));
            }
          '
      - name: Validate game catalog
        run: npm run check:catalog
      - name: Discover multiplayer catalogue candidates (not approved integrations)
        run: npm run report:multiplayer-candidates
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
