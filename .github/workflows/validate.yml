name: Fun Ground checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: fun-ground-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Audit dependency vulnerabilities
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8"));
            const v = report.metadata?.vulnerabilities || {};
            console.log("Dependency audit summary:", JSON.stringify(v));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(JSON.stringify({ package: name, severity: item.severity, direct: item.isDirect, range: item.range, fixAvailable: item.fixAvailable }));
            }
          '
      - name: Validate game catalog
        run: npm run check:catalog
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
