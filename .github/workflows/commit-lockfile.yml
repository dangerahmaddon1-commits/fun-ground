name: Commit reproducible npm lockfile

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm writing package-lock.json to the v0.3.0 development branch only"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  commit-lockfile:
    if: github.ref == 'refs/heads/codex/fun-ground-v0.3.0-foundation' && inputs.confirm == true
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the development branch
        uses: actions/checkout@v5
        with:
          ref: codex/fun-ground-v0.3.0-foundation
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve and patch dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts

      - name: Verify dependencies and project checks
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run check:catalog
          npx tsc --noEmit

      - name: Commit lockfile to the development branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is unchanged; no commit is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: commit reproducible npm dependency lockfile"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/codex/fun-ground-v0.3.0-foundation
